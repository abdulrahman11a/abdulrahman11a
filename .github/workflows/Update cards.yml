name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:       

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # كارت مشروع MyZoo
      - name: Generate MyZoo pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=MyZoo&theme=dark&border_color=00ff88&title_color=00ff88&icon_color=00ff88'
          path: cards/pin-myzoo.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      #Talabat_Web_Api
      - name: Generate Talabat_Web_Api pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=Talabat_Web_Api&theme=dark&border_color=00ff88&title_color=00ff88&icon_color=00ff88'
          path: cards/pin-talabat.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # كارت مشروع CRUD_Operations_Project
      - name: Generate CRUD_Operations_Project pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=CRUD_Operations_Project&theme=dark&border_color=00ff88&title_color=00ff88&icon_color=00ff88'
          path: cards/pin-crud.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # كارت التروفيز
      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          output_path: cards/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # عمل commit للملفات اللي اتولّدت
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          git commit -m "Update README cards" || exit 0
          git push
